name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

env:
  CARGO_TERM_COLOR: always
  RUST_BACKTRACE: 1

jobs:
  check:
    name: Check & Test
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Install Rust toolchain
        uses: dtolnay/rust-action@stable
        with:
          toolchain: "1.91"
          components: rustfmt, clippy

      - name: Cache cargo registry
        uses: actions/cache@v4
        with:
          path: |
            ~/.cargo/registry
            ~/.cargo/git
            target
          key: ${{ runner.os }}-cargo-${{ hashFiles('**/Cargo.lock') }}
          restore-keys: |
            ${{ runner.os }}-cargo-

      - name: Check formatting
        run: cargo fmt --all -- --check

      - name: Run clippy
        run: cargo clippy --workspace --all-targets -- -D warnings

      - name: Run tests
        run: cargo test --workspace

      - name: Check workspace compiles
        run: cargo check --workspace

  gui-check:
    name: GUI Build Check
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Install Rust toolchain
        uses: dtolnay/rust-action@stable
        with:
          toolchain: "1.91"
          targets: wasm32-unknown-unknown

      - name: Install trunk
        run: cargo install trunk

      - name: Check GUI crate
        run: cargo check --manifest-path crates/strix-gui/Cargo.toml

      - name: Build GUI
        run: |
          cd crates/strix-gui
          env RUSTFLAGS='' trunk build --release

  security:
    name: Security Audit
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Install cargo-audit
        run: cargo install cargo-audit

      - name: Install cargo-deny
        run: cargo install cargo-deny

      - name: Run cargo audit
        run: cargo audit

      - name: Run cargo deny
        run: |
          OUTPUT=$(cargo deny check 2>&1) && RC=0 || RC=$?
          if [ $RC -ne 0 ]; then
            if echo "$OUTPUT" | grep -q "unsupported CVSS version"; then
              echo "::warning::cargo deny failed due to advisory-db CVSS 4.0 parse error (upstream issue)"
            else
              echo "$OUTPUT"
              exit $RC
            fi
          fi

# Prometheus configuration for Strix monitoring
#
# Start with:
#   docker compose -f docker-compose.yml -f docker-compose.monitoring.yml --profile monitoring up -d
#
# The monitoring override sets STRIX_METRICS_ADDRESS=0.0.0.0:9090 so Prometheus
# can scrape metrics within the Docker network without exposing them to the host.

global:
  scrape_interval: 15s
  evaluation_interval: 15s

scrape_configs:
  - job_name: 'strix'
    static_configs:
      - targets: ['strix:9090']
    metrics_path: /metrics
    scrape_interval: 15s
    scrape_timeout: 10s

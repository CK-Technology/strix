# Strix reverse proxy — production nginx config
#
#   s3.cktechnology.io     -> S3 API           (127.0.0.1:9000)
#   strix.cktechnology.io  -> console + Admin   (127.0.0.1:9001)
#
# Uses a wildcard cert for *.cktechnology.io issued with acme.sh:
#   /etc/nginx/certs/cktechnology.io/fullchain.pem
#   /etc/nginx/certs/cktechnology.io/privkey.pem
# See docs/guides/tls-acme.md for issuance.
#
# Install:
#   cp deploy/nginx/strix.conf            /etc/nginx/conf.d/strix.conf
#   cp deploy/nginx/strix-ssl-params.conf /etc/nginx/snippets/strix-ssl-params.conf
#   nginx -t && systemctl reload nginx
#
# Keep Strix bound to loopback (127.0.0.1:9000 / :9001) so only nginx is public.

# Keepalive upstreams reduce connection churn under load.
upstream strix_s3 {
    server 127.0.0.1:9000;
    keepalive 32;
}

upstream strix_console {
    server 127.0.0.1:9001;
    keepalive 32;
}

# ---------------------------------------------------------------------------
# S3 API  ->  s3.cktechnology.io
# ---------------------------------------------------------------------------
server {
    listen 443 ssl;
    listen [::]:443 ssl;
    http2 on;                         # nginx < 1.25.1: use `listen 443 ssl http2;`
    server_name s3.cktechnology.io;

    ssl_certificate     /etc/nginx/certs/cktechnology.io/fullchain.pem;
    ssl_certificate_key /etc/nginx/certs/cktechnology.io/privkey.pem;
    include snippets/strix-ssl-params.conf;

    # S3 objects can be large; 0 = unlimited (or set to your max object size).
    client_max_body_size 0;

    # CRITICAL: do not collapse `//` in object keys. With the default
    # (merge_slashes on), a key like `path//to/object` would be corrupted.
    merge_slashes off;

    # Headroom for many x-amz-meta-* headers on a single request.
    large_client_header_buffers 4 32k;

    location / {
        proxy_pass http://strix_s3;
        proxy_http_version 1.1;
        proxy_set_header Connection "";          # enable upstream keepalive

        # SigV4 signs the Host header — pass it through unchanged or
        # signatures fail with SignatureDoesNotMatch.
        proxy_set_header Host              $host;
        proxy_set_header X-Real-IP         $remote_addr;
        proxy_set_header X-Forwarded-For   $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;

        # Stream large request/response bodies instead of spooling to disk.
        proxy_request_buffering off;
        proxy_buffering         off;

        # Generous timeouts for large transfers.
        proxy_read_timeout 300s;
        proxy_send_timeout 300s;
    }
}

# ---------------------------------------------------------------------------
# Console + Admin API  ->  strix.cktechnology.io
# ---------------------------------------------------------------------------
server {
    listen 443 ssl;
    listen [::]:443 ssl;
    http2 on;
    server_name strix.cktechnology.io;

    ssl_certificate     /etc/nginx/certs/cktechnology.io/fullchain.pem;
    ssl_certificate_key /etc/nginx/certs/cktechnology.io/privkey.pem;
    include snippets/strix-ssl-params.conf;

    # Console object browser can upload large files too.
    client_max_body_size 0;

    location / {
        proxy_pass http://strix_console;
        proxy_http_version 1.1;
        proxy_set_header Connection "";

        proxy_set_header Host              $host;
        proxy_set_header X-Real-IP         $remote_addr;
        proxy_set_header X-Forwarded-For   $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;

        proxy_request_buffering off;
        proxy_buffering         off;
    }
}

# ---------------------------------------------------------------------------
# HTTP -> HTTPS redirect
# ---------------------------------------------------------------------------
server {
    listen 80;
    listen [::]:80;
    server_name s3.cktechnology.io strix.cktechnology.io;
    return 301 https://$host$request_uri;
}
